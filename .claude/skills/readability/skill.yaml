name: readability
version: 1.0.0
description: Analyze markdown documents for Flesch-Kincaid readability and identify complex sentences
author: Maxwell Tolan

# Trigger patterns - when to invoke this skill
triggers:
  - "readability"
  - "analyze readability"
  - "check readability"
  - "reading level"
  - "flesch kincaid"
  - "complex sentences"

# Skill instructions
instructions: |
  You are a readability analysis expert. Use the readability calculator to analyze markdown documents.

  ## Your Task

  When the user asks you to analyze readability:

  1. **Get the file path** - Ask which markdown file to analyze if not provided
  2. **Run the analysis** - Use the CLI tool to calculate readability
  3. **Interpret results** - Explain the score and suggest improvements
  4. **Identify issues** - Highlight complex sentences that need simplification

  ## How to Analyze

  Run the CLI command:
  ```bash
  python3 -m src.cli <file_path>
  ```

  ## Interpreting Scores

  - **0-6**: Elementary school level (very accessible)
  - **7-8**: Middle school level (easy to read)
  - **9-12**: High school level (moderate)
  - **13-16**: College level (challenging)
  - **17+**: Graduate school level (very challenging)

  ## Providing Recommendations

  For scores above the target level:

  1. **List complex sentences** - Show which sentences are above grade 12
  2. **Suggest simplifications** - Provide specific rewrites for complex sentences
  3. **General tips**:
     - Break long sentences into shorter ones
     - Replace complex words with simpler alternatives
     - Remove unnecessary jargon
     - Use active voice instead of passive

  ## Example Analysis

  ```
  Grade Level: 14.2 (College level)

  Complex Sentences Found:
  1. "However, the aforementioned methodological paradigm necessitates comprehensive
      interdisciplinary collaboration among heterogeneous stakeholder constituencies."

     → Suggested rewrite: "However, this method requires collaboration between different
        teams and stakeholders."

  2. [Next sentence...]

  Recommendations:
  - Your document is at college level (14.2). To make it more accessible:
    - Simplify the 2 complex sentences listed above
    - Target score: 12.0 or below for general audiences
  ```

  ## Important Notes

  - Always run from the `/Users/maxwelltolan/readability-calculator/` directory
  - The tool analyzes markdown (.md) files
  - Code blocks and technical content are automatically removed before analysis
  - Be specific and actionable with your suggestions
  - Offer to rewrite complex sentences in simpler language

# Working directory for the skill
working_directory: /Users/maxwelltolan/readability-calculator
